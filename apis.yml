name: Habyt
description: 'Habyt is a flexible-living and co-living accommodation provider offering furnished
  studios, apartments, and private rooms for stays ranging from a single night to several
  months. Positioned as "a new category of living for people in motion," the company blends
  hotel-style service and amenities with residential flexibility, targeting mobile professionals,
  relocators, and long-term travelers. Habyt operates properties across Europe (Berlin, Madrid,
  Vienna, with Lisbon and Milan announced) and Asia (multiple locations in Singapore), and was
  added to the API Evangelist network as a portfolio company of HV Capital. Habyt is a consumer
  real-estate and hospitality operator rather than an API-first technology provider; as of this
  enrichment pass no public developer API, SDK, or documentation surface was found.'
